[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemmarouter"
version = "0.1.2"
description = "Set-Equivariant Decision & Tool Router with Calibrated Abstention on EmbeddingGemma 2"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Ajeet Kumar Upadhyay"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "routing",
    "decision-router",
    "intent-classification",
    "mcp-tools",
    "abstention",
    "embeddinggemma",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.25.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
arena = ["laya>=0.4.22"]
onnx = ["onnx>=1.16.0", "onnxruntime>=1.19.0"]
gguf = ["gguf>=0.10.0"]
edge = ["onnx>=1.16.0", "onnxruntime>=1.19.0", "gguf>=0.10.0"]

[project.urls]
Homepage = "https://github.com/Ajeetkrup/gemmarouter"
Repository = "https://github.com/Ajeetkrup/gemmarouter"
Model = "https://huggingface.co/Ajeet-001/embeddinggemma2-decision-router"

[project.scripts]
gemmarouter = "gemmarouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
